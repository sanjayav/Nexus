<!doctype html>
<html lang="en" data-theme="demo-flat">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fonts are self-hosted (public/fonts, SIL OFL 1.1): Inter variable and
      JetBrains Mono, Latin subsets. No third-party font CDN — Google Fonts and
      rsms.me are unreachable from mainland China. Hanzi always render in the
      platform face (PingFang SC / Microsoft YaHei / Noto Sans SC), declared in
      index.css and tailwind.config.js. @font-face lives in src/index.css.
    -->
    <link rel="preload" href="/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Nexus · Sustainability reporting</title>
    <meta name="description" content="Nexus is a bilingual (English / 简体中文) sustainability reporting platform: collect ESG data, review and approve it, and publish reports against GRI, ISSB, ESRS, CDP and China exchange guidelines (SSE, SZSE, BSE, HKEX)." />
    <meta name="theme-color" content="#10B981" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexus · Sustainability reporting" />
    <meta property="og:description" content="Nexus is a bilingual (English / 简体中文) sustainability reporting platform: collect ESG data, review and approve it, and publish reports against GRI, ISSB, ESRS, CDP and China exchange guidelines (SSE, SZSE, BSE, HKEX)." />
    <meta property="og:site_name" content="Nexus by Aeiforo" />
    <meta property="og:url" content="https://nexus.aeiforo.co.uk/" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus · Sustainability reporting" />
    <meta name="twitter:description" content="Nexus is a bilingual (English / 简体中文) sustainability reporting platform: collect ESG data, review and approve it, and publish reports against GRI, ISSB, ESRS, CDP and China exchange guidelines (SSE, SZSE, BSE, HKEX)." />
    <script>
      // Apply persisted theme + color mode before first paint to avoid flash.
      (function() {
        try {
          var t = localStorage.getItem('nexus-theme');
          if (t === 'glass' || t === 'demo-flat') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
        try {
          var m = localStorage.getItem('aeiforo_color_mode') || 'auto';
          var resolved = m;
          if (m === 'auto') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          if (resolved === 'light' || resolved === 'dark') {
            document.documentElement.setAttribute('data-color-mode', resolved);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background-color: #F8FAF9; }
      html[data-theme='glass'] { background-color: #FAFAF8; }
      html[data-color-mode='light'] { background-color: #F8FAF9; }
      html[data-color-mode='dark']  { background-color: #0B0E13; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
